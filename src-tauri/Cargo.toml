[package]
name = "ting-music"
version = "0.9.3"
description = "A compact player for NetEase Cloud Music and QQ Music"
authors = ["Ting contributors"]
edition = "2021"

[lib]
name = "ting_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
base64 = "0.22"
num-bigint = "0.4"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "time"] }
unicode-normalization = "0.1"
unicode-casefold = "0.2"
regex = "1"
md-5 = "0.10"
symphonia = { version = "0.5.5", default-features = false, features = ["flac", "mp3"] }
lofty = "0.22.4"
time = "0.3"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = "3.7"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
keyring = "3"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6.3"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSURL", "NSString", "NSError"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "UIActivity", "UIActivityViewController", "UIImage", "UIResponder", "UIView", "UIViewController", "UIPresentationController", "UIPopoverPresentationController", "block2"] }

# Xcode 27 internalizes SwiftRs C exports inside Tauri's static archive.
# Local source is upstream 1.0.8 plus the documented build-helper fix.
[patch.crates-io]
swift-rs = { path = "compat/swift-rs" }
# Official upstream fix for iOS UISceneConfiguration use-after-free (tao#1245).
tao = { git = "https://github.com/tauri-apps/tao", rev = "f2163508104413ef0609178dcebdd5803b496211" }
