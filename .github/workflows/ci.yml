name: Quality and security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS Apple Silicon build and regression
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare build dependencies
        run: |
          test "$(uname -m)" = arm64
          npm ci
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          node scripts/prepare-desktop.mjs
          node scripts/check-release.mjs
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Frontend build and model tests
        run: |
          npm run format:check
          npm run build
          npm test
      - name: Browser regression
        run: |
          npx playwright install chromium
          npx playwright test
      - name: Rust and release regression
        run: |
          node scripts/cargo.mjs fmt --manifest-path src-tauri/Cargo.toml -- --check
          node scripts/cargo.mjs test --locked --manifest-path src-tauri/Cargo.toml
          python3 -B scripts/infrastructure-test.py
          xcrun clang -fobjc-arc -fblocks -framework Foundation -framework AppKit tests/folder_sync_native.m -o /tmp/ting-folder-sync-test
          /tmp/ting-folder-sync-test
      - name: Build native app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build -- --locked
      - name: Upload macOS app artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Ting-0.9.7-build-90701-macOS
          path: |
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.sig
          if-no-files-found: error
          retention-days: 14
      - name: Frontend dependency audit
        run: npm audit --audit-level=high
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  macos-intel:
    name: macOS Intel build
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare cross build for x86_64
        run: |
          npm ci
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-apple-darwin
          node scripts/prepare-desktop.mjs
      # Built on the Apple Silicon runner for the Intel target; the regression
      # suite already ran on the same sources in the macOS job.
      - name: Build Intel app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target x86_64-apple-darwin -- --locked
      - name: Upload Intel app artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Ting-0.9.7-build-90701-macOS-Intel
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.sig
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Native media / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev ffmpeg
      - name: Windows test audio dependencies
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Prepare
        shell: bash
        run: |
          npm ci
          rustup toolchain install stable --profile minimal
          rustup default stable
          node scripts/prepare-desktop.mjs
      - name: Build and native regression
        shell: bash
        run: |
          npm run build
          npm test
          node scripts/cargo.mjs test --locked --manifest-path src-tauri/Cargo.toml
      # The updater signing key is only exposed to the packaging step.
      - name: Build native installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build -- --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Ting-0.9.7-build-90701-${{ runner.os }}${{ runner.arch == 'ARM64' && '-ARM64' || '' }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/*/*.sig
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android arm64 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Prepare
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          npm ci
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
          npm run tauri -- android init
      - name: Build debug APK
        run: CARGO_INCREMENTAL=0 CARGO_PROFILE_DEV_DEBUG=0 npm run tauri -- android build --debug --target aarch64 --apk --ci -- --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Ting-0.9.7-build-90701-Android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          if-no-files-found: error
          retention-days: 14
      # A release APK signed with Ting's own key, once the repository has the
      # keystore secrets (docs/ANDROID-SIGNING.md). Skipped quietly otherwise.
      - name: Build signed release APK
        id: release_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.TING_ANDROID_KEYSTORE_BASE64 }}
          TING_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TING_ANDROID_KEYSTORE_PASSWORD }}
          TING_ANDROID_KEY_ALIAS: ${{ secrets.TING_ANDROID_KEY_ALIAS }}
          TING_ANDROID_KEY_PASSWORD: ${{ secrets.TING_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No Android signing secrets; release APK skipped."
            exit 0
          fi
          export TING_ANDROID_KEYSTORE="$RUNNER_TEMP/ting-release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$TING_ANDROID_KEYSTORE"
          CARGO_INCREMENTAL=0 npm run tauri -- android build --target aarch64 --apk --ci -- --locked
          rm -f "$TING_ANDROID_KEYSTORE"
          echo "built=true" >> "$GITHUB_OUTPUT"
      - if: steps.release_apk.outputs.built == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Ting-0.9.7-build-90701-Android-Release
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          if-no-files-found: error
          retention-days: 14

  secrets:
    name: Source and history credential scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install fixed Gitleaks release from source
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan release candidates and Git history
        run: python3 -B scripts/scan-secrets.py --history --gitleaks "$(go env GOPATH)/bin/gitleaks"
