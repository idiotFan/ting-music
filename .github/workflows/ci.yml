name: Quality and security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS Apple Silicon build and regression
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare build dependencies
        run: |
          test "$(uname -m)" = arm64
          npm ci
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          node scripts/prepare-desktop.mjs
          node scripts/check-release.mjs
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Frontend build and model tests
        run: |
          npm run format:check
          npm run build
          npm test
      - name: Browser regression
        run: |
          npx playwright install chromium
          npx playwright test
      - name: Rust and release regression
        run: |
          node scripts/cargo.mjs fmt --manifest-path src-tauri/Cargo.toml -- --check
          node scripts/cargo.mjs test --locked --manifest-path src-tauri/Cargo.toml
          python3 -B scripts/infrastructure-test.py
          xcrun clang -fobjc-arc -fblocks -framework Foundation -framework AppKit tests/folder_sync_native.m -o /tmp/ting-folder-sync-test
          /tmp/ting-folder-sync-test
      - name: Build native app
        run: npm run tauri -- build -- --locked
      - name: Frontend dependency audit
        run: npm audit --audit-level=high
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    name: Native media / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev ffmpeg
      - name: Windows test audio dependencies
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Prepare
        shell: bash
        run: |
          npm ci
          rustup toolchain install stable --profile minimal
          rustup default stable
          node scripts/prepare-desktop.mjs
      - name: Build and native regression
        shell: bash
        run: |
          npm run build
          npm test
          node scripts/cargo.mjs test --locked --manifest-path src-tauri/Cargo.toml
          npm run tauri -- build -- --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Ting-0.9.6-build-90601-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  secrets:
    name: Source and history credential scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install fixed Gitleaks release from source
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan release candidates and Git history
        run: python3 -B scripts/scan-secrets.py --history --gitleaks "$(go env GOPATH)/bin/gitleaks"
