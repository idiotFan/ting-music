name: Quality and security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS Apple Silicon build and regression
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare build dependencies
        run: |
          test "$(uname -m)" = arm64
          npm ci
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          node scripts/prepare-desktop.mjs
          node scripts/check-release.mjs
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Frontend build and model tests
        run: |
          npm run format:check
          npm run build
          npm test
      - name: Browser regression
        run: |
          npx playwright install chromium
          npx playwright test
      - name: Rust and release regression
        run: |
          node scripts/cargo.mjs fmt --manifest-path src-tauri/Cargo.toml -- --check
          node scripts/cargo.mjs test --locked --manifest-path src-tauri/Cargo.toml
          python3 -B scripts/infrastructure-test.py
          xcrun clang -fobjc-arc -fblocks -framework Foundation -framework AppKit tests/folder_sync_native.m -o /tmp/ting-folder-sync-test
          /tmp/ting-folder-sync-test
      - name: Build native app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build -- --locked
      - name: Upload macOS app artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Ting-0.9.7-build-90701-macOS
          path: |
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.sig
          if-no-files-found: error
          retention-days: 14
      - name: Frontend dependency audit
        run: npm audit --audit-level=high
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    name: Native media / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev ffmpeg
      - name: Windows test audio dependencies
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Prepare
        shell: bash
        run: |
          npm ci
          rustup toolchain install stable --profile minimal
          rustup default stable
          node scripts/prepare-desktop.mjs
      - name: Build and native regression
        shell: bash
        run: |
          npm run build
          npm test
          node scripts/cargo.mjs test --locked --manifest-path src-tauri/Cargo.toml
      # The updater signing key is only exposed to the packaging step.
      - name: Build native installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build -- --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Ting-0.9.7-build-90701-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/*/*.sig
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android arm64 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Prepare
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          npm ci
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
          npm run tauri -- android init
      - name: Build debug APK
        run: CARGO_INCREMENTAL=0 CARGO_PROFILE_DEV_DEBUG=0 npm run tauri -- android build --debug --target aarch64 --apk --ci -- --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Ting-0.9.7-build-90701-Android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          if-no-files-found: error
          retention-days: 14

  harmony:
    name: HarmonyOS NEXT arm64 hap (unsigned, experimental)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: HarmonyOS command line tools
        uses: ErBWs/setup-ohos@v2
        with:
          version: 6.1.1.280
          cache: true
      - name: Cache Rust tools and registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/ohrs
            ~/.cargo/registry
            ~/.cargo/git
          key: ohos-tools-${{ runner.os }}-${{ hashFiles('src-tauri/ohos/cargo-config.toml') }}-3
      - name: Prepare
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1
          npm ci
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-unknown-linux-ohos
          test -x ~/.cargo/bin/ohrs || cargo install ohrs --locked
          # The branch lockfile no longer resolves (rustls-platform-verifier/webpki), so let cargo re-resolve.
          test -x ~/.cargo/bin/cargo-tauri || cargo install tauri-cli --git https://github.com/tauri-apps/tauri --branch feat/open-harmony
          # OpenHarmony crates come from the feat/open-harmony branches; keep the patch out of Cargo.toml.
          # openharmony-ability dropped its `webview` feature after 295a276a, which the branches still
          # need, so that commit is checked out and patched in by path (a git source cannot patch itself).
          git clone -q https://github.com/harmony-contrib/openharmony-ability.git "$HOME/openharmony-ability"
          git -C "$HOME/openharmony-ability" checkout -q 295a276a699ba2352addc69b8cacb6acd3be6ab1
          mkdir -p ~/.cargo && cat src-tauri/ohos/cargo-config.toml >> ~/.cargo/config.toml
          cat >> ~/.cargo/config.toml <<EOF2
          [patch."https://github.com/harmony-contrib/openharmony-ability.git"]
          openharmony-ability = { path = "$HOME/openharmony-ability/crates/ability" }
          openharmony-ability-derive = { path = "$HOME/openharmony-ability/crates/derive" }
          EOF2
          # cargo-mobile2 derives DEVECO_SDK_HOME as three parents of OHOS_HOME, so
          # expose the SDK one level deeper than the command line tools lay it out.
          ln -s . "$OHOS_NDK_HOME/current"
          mkdir -p "$HOME/deveco/sdk" && ln -s "$HOS_SDK_HOME/default" "$HOME/deveco/sdk/default"
          echo "OHOS_HOME=$HOME/deveco/sdk/default/openharmony/current" >> "$GITHUB_ENV"
          echo "DEVECO_SDK_HOME=$HOME/deveco/sdk" >> "$GITHUB_ENV"
          echo "OHOS_NDK_HOME=$HOME/deveco/sdk/default/openharmony/current" >> "$GITHUB_ENV"
      - name: Build hap
        run: |
          npm run tauri -- ohos init --ci
          npm run tauri -- ohos build --ci
          ls -l src-tauri/gen/ohos/entry/build/default/outputs/default/
      # Signing needs AppGallery Connect material (.p12 keystore, .cer certificate,
      # .p7b debug/release profile) stored as secrets; without them the job still
      # publishes the unsigned hap so the build itself stays verifiable.
      - name: Sign hap
        env:
          HARMONY_KEYSTORE_P12: ${{ secrets.HARMONY_KEYSTORE_P12 }}
          HARMONY_KEYSTORE_PASSWORD: ${{ secrets.HARMONY_KEYSTORE_PASSWORD }}
          HARMONY_KEY_ALIAS: ${{ secrets.HARMONY_KEY_ALIAS }}
          HARMONY_KEY_PASSWORD: ${{ secrets.HARMONY_KEY_PASSWORD }}
          HARMONY_CERT_CER: ${{ secrets.HARMONY_CERT_CER }}
          HARMONY_PROFILE_P7B: ${{ secrets.HARMONY_PROFILE_P7B }}
        run: |
          if [ -z "$HARMONY_KEYSTORE_P12" ] || [ -z "$HARMONY_PROFILE_P7B" ] || [ -z "$HARMONY_CERT_CER" ]; then
            echo "No HarmonyOS signing secrets; leaving the hap unsigned."
            exit 0
          fi
          set -euo pipefail
          sign="$(mktemp -d)"
          trap 'rm -rf "$sign"' EXIT
          printf '%s' "$HARMONY_KEYSTORE_P12" | base64 -d > "$sign/keystore.p12"
          printf '%s' "$HARMONY_CERT_CER" | base64 -d > "$sign/app.cer"
          printf '%s' "$HARMONY_PROFILE_P7B" | base64 -d > "$sign/app.p7b"
          out=src-tauri/gen/ohos/entry/build/default/outputs/default
          java -jar "$HOS_SDK_HOME/default/openharmony/toolchains/lib/hap-sign-tool.jar" sign-app \
            -mode localSign -signAlg SHA256withECDSA -signCode 1 \
            -keystoreFile "$sign/keystore.p12" -keystorePwd "$HARMONY_KEYSTORE_PASSWORD" \
            -keyAlias "$HARMONY_KEY_ALIAS" -keyPwd "$HARMONY_KEY_PASSWORD" \
            -appCertFile "$sign/app.cer" -profileFile "$sign/app.p7b" \
            -inFile "$out/entry-default-unsigned.hap" -outFile "$out/entry-default-signed.hap"
          rm -f "$out/entry-default-unsigned.hap"
          ls -l "$out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Ting-0.9.7-build-90701-HarmonyOS
          path: src-tauri/gen/ohos/entry/build/default/outputs/default/*.hap
          if-no-files-found: error
          retention-days: 14

  secrets:
    name: Source and history credential scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install fixed Gitleaks release from source
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan release candidates and Git history
        run: python3 -B scripts/scan-secrets.py --history --gitleaks "$(go env GOPATH)/bin/gitleaks"
